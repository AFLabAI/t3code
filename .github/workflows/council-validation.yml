name: Council V1 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - council-v1-validation
  pull_request:
    branches:
      - council-v1-validation

concurrency:
  group: council-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Diagnose git environment
        if: always()
        run: |
          echo "## Git Environment Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Variables" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB_SHA: $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB_REF: $GITHUB_REF" >> $GITHUB_STEP_SUMMARY
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Git State" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pwd >> $GITHUB_STEP_SUMMARY
          git --version >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git version failed" >> $GITHUB_STEP_SUMMARY
          git status --porcelain=v1 >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git status --porcelain failed" >> $GITHUB_STEP_SUMMARY
          git status >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git status failed" >> $GITHUB_STEP_SUMMARY
          git rev-parse --show-toplevel >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git rev-parse failed" >> $GITHUB_STEP_SUMMARY
          git rev-parse --is-inside-work-tree >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git is-inside-work-tree failed" >> $GITHUB_STEP_SUMMARY
          git rev-parse HEAD >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git rev-parse HEAD failed" >> $GITHUB_STEP_SUMMARY
          git branch --show-current >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git branch failed" >> $GITHUB_STEP_SUMMARY
          git remote -v >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git remote failed" >> $GITHUB_STEP_SUMMARY
          git config --show-origin --get-all safe.directory >> $GITHUB_STEP_SUMMARY 2>&1 || echo "safe.directory not set" >> $GITHUB_STEP_SUMMARY
          git submodule status >> $GITHUB_STEP_SUMMARY 2>&1 || echo "no submodules" >> $GITHUB_STEP_SUMMARY
          git worktree list >> $GITHUB_STEP_SUMMARY 2>&1 || echo "git worktree failed" >> $GITHUB_STEP_SUMMARY
          find . -maxdepth 2 -name .git -type f -o -name .git -type d 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || echo "find .git failed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Check
        if: always()
        run: |
          set +e
          vp check 2>&1 | tee /tmp/vp-check-output.txt
          VP_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "## VP Check Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VP_CHECK_ACTUAL_EXIT = \`$VP_EXIT_CODE\`**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $VP_EXIT_CODE -ne 0 ]; then
            echo "### VP Check Failed - Full Output:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/vp-check-output.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            ERROR_COUNT=$(grep -c "error:" /tmp/vp-check-output.txt || echo 0)
            echo "**VP_CHECK_ACTUAL_ERRORS = \`$ERROR_COUNT\`**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ VP Check PASSED" >> $GITHUB_STEP_SUMMARY
            echo "**VP_CHECK_ACTUAL_ERRORS = \`0\`**" >> $GITHUB_STEP_SUMMARY
          fi

          exit $VP_EXIT_CODE

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Configure git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml
