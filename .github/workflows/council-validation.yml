name: Council V1 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - council-v1-validation
  pull_request:
    branches:
      - council-v1-validation

concurrency:
  group: council-validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-and-commit:
    name: Format & Auto-Commit (Temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run formatter
        run: vpr fmt

      - name: Safety gate - verify only formatter changes
        run: |
          echo "Files changed:"
          git status --short
          echo "---"
          echo "Diff stat:"
          git diff --stat
          echo "---"
          echo "Checking for semantic changes..."
          ADDED_IMPORTS=$(git diff | grep -E '^\+\s*import ' | wc -l)
          REMOVED_IMPORTS=$(git diff | grep -E '^\-\s*import ' | wc -l)
          ADDED_FUNCTIONS=$(git diff | grep -E '^\+\s*(function|const|class|export).*\s*=.*=>|^\+\s*function ' | wc -l)
          echo "Added imports: $ADDED_IMPORTS"
          echo "Removed imports: $REMOVED_IMPORTS"
          echo "Added function-like declarations: $ADDED_FUNCTIONS"
          if [ $ADDED_IMPORTS -gt 0 ] || [ $REMOVED_IMPORTS -gt 0 ] || [ $ADDED_FUNCTIONS -gt 0 ]; then
            echo "ERROR: Semantic changes detected (new/removed imports or functions), refusing auto-commit"
            exit 1
          fi
          echo "✓ No semantic changes detected, safe to auto-commit"

      - name: Check if changes exist
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "CI Formatter"
          git config user.email "ci-formatter@example.com"

      - name: Auto-commit formatter changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore: normalize formatting for CI validation"
          git push origin council-v1-validation

      - name: Report formatter status
        run: |
          echo "FORMAT_CHANGED_FILES=$(git status --short | wc -l)" >> $GITHUB_ENV
          echo "FORMAT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "FORMAT_PUSH=PASS" >> $GITHUB_ENV

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run test

      - name: Publish transfer budget report
        if: always()
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml
